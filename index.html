<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>熱門股券商進出排行</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Microsoft JhengHei', 'PingFang TC', Arial, sans-serif; font-size: 13px; background: #eef1f6; color: #1a1a2e; }

    /* ── 頁首 ── */
    .header { background: linear-gradient(135deg, #1a3a6b 0%, #2563a8 100%); color: white; padding: 8px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.25); position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 15px; font-weight: bold; white-space: nowrap; }
    .divider { width: 1px; height: 20px; background: rgba(255,255,255,0.3); flex-shrink: 0; }
    .tab-group { display: flex; gap: 5px; }

    .tab-btn, .mode-btn, .refresh-btn, .query-btn, .setting-btn {
      padding: 5px 13px; border-radius: 20px; cursor: pointer; font-size: 12px; transition: all .2s; white-space: nowrap;
    }
    .tab-btn  { border: 1.5px solid rgba(255,255,255,0.5); background: transparent; color: rgba(255,255,255,0.85); }
    .tab-btn:hover { background: rgba(255,255,255,0.15); }
    .tab-btn.active { background: white; color: #1a3a6b; font-weight: bold; border-color: white; }
    .mode-btn { border: 1.5px solid rgba(255,255,255,0.5); background: transparent; color: rgba(255,255,255,0.85); }
    .mode-btn:hover { background: rgba(255,255,255,0.15); }
    .mode-btn.active { background: #f0a500; color: white; border-color: #f0a500; font-weight: bold; }
    .refresh-btn { border: 1.5px solid rgba(255,255,255,0.5); background: transparent; color: white; }
    .refresh-btn:hover { background: rgba(255,255,255,0.15); }
    .query-btn  { border: none; background: #f0a500; color: white; font-weight: bold; }
    .query-btn:hover { background: #d4920a; }
    .setting-btn { border: 1.5px solid rgba(255,255,255,0.3); background: transparent; color: rgba(255,255,255,0.6); font-size: 11px; padding: 3px 8px; }
    .setting-btn:hover { color: white; border-color: white; }

    #hist-controls { display: none; align-items: center; gap: 6px; }
    #hist-controls input[type=date] { padding: 4px 8px; border: 1.5px solid rgba(255,255,255,0.6); border-radius: 20px; background: rgba(255,255,255,0.15); color: white; font-size: 12px; outline: none; }
    #hist-controls input[type=date]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    .update-time { font-size: 11px; opacity: 0.8; margin-left: auto; white-space: nowrap; }

    /* Token 設定 */
    #token-bar { background: #fff3cd; color: #856404; padding: 8px 14px; font-size: 12px; display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
    #token-bar input { padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; width: 320px; max-width: 100%; }
    #token-bar button { padding: 4px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-save { background: #1a3a6b; color: white; }
    .btn-cancel { background: #ccc; color: #333; }

    /* ── 主內容 ── */
    .content { padding: 12px; max-width: 1400px; margin: 0 auto; }
    .loading { text-align: center; padding: 60px; color: #888; font-size: 14px; }
    .error   { text-align: center; padding: 20px; color: #c00; font-size: 13px; line-height: 2; }
    .info    { text-align: center; padding: 20px; color: #555; font-size: 13px; line-height: 2; }

    /* ── 卡片 ── */
    .card { background: white; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.1); overflow: hidden; margin-bottom: 12px; }
    .card-title { background: linear-gradient(90deg, #1a3a6b, #2563a8); color: white; padding: 7px 14px; font-weight: bold; font-size: 13px; }

    /* ── 彙總表 ── */
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; }
    .sum-table { width: 100%; border-collapse: collapse; }
    .sum-table th { background: #dde6f0; color: #1a3a6b; padding: 5px 10px; font-size: 12px; text-align: center; border-bottom: 1px solid #c5d0de; }
    .sum-table td { padding: 4px 10px; border-bottom: 1px solid #edf0f4; font-size: 12px; }
    .sum-table td:last-child { text-align: right; font-weight: bold; }
    .sum-table tr:not(:first-child):hover td { background: #e8f0fa; cursor: pointer; }
    .sum-table tr[data-code] td:first-child::after { content: ' ↓'; font-size: 10px; opacity: 0.4; }
    .sum-table:first-child { border-right: 1px solid #d0d9e4; }

    /* ── 明細表 ── */
    .detail-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .main-table { width: 100%; border-collapse: collapse; min-width: 440px; }
    .main-table thead th { background: #dde6f0; color: #1a3a6b; padding: 6px 10px; text-align: center; border-bottom: 2px solid #b0c4d8; white-space: nowrap; font-size: 12px; }
    .main-table td { padding: 4px 10px; border-bottom: 1px solid #edf0f4; font-size: 12px; }
    .main-table tbody tr:not(.stock-hdr) td:first-child { text-align: center; color: #888; width: 36px; }
    .main-table td:nth-child(3), .main-table td:nth-child(4), .main-table td:nth-child(5) { text-align: right; }
    .main-table tbody tr:not(.stock-hdr):hover td { background: #f5f8fc; }
    .main-table tbody tr.stock-hdr td { background: linear-gradient(90deg, #1a3a6b, #2563a8); color: white; font-weight: bold; padding: 6px 10px; font-size: 13px; border-bottom: none; }
    .main-table tbody tr.stock-hdr td:last-child { text-align: right; }
    .main-table tbody tr.stock-hdr:hover td { filter: brightness(1.1); }

    /* ── 盤中比較控制列 ── */
    .cmp-ctrl { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #f0f4fa; border-radius: 8px 8px 0 0; flex-wrap: wrap; margin-bottom: -1px; }
    .cmp-ctrl label { font-size: 12px; color: #555; white-space: nowrap; }
    .cmp-ctrl select { padding: 4px 8px; border: 1px solid #b0c4d8; border-radius: 4px; font-size: 12px; background: white; }
    .cmp-ctrl button { padding: 5px 14px; background: #1a3a6b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .cmp-ctrl button:hover { background: #2563a8; }

    /* ── 盤中比較表 ── */
    .cmp-table { width: 100%; border-collapse: collapse; min-width: 560px; }
    .cmp-table thead th { background: #dde6f0; color: #1a3a6b; padding: 6px 10px; text-align: center; border-bottom: 2px solid #b0c4d8; font-size: 12px; white-space: nowrap; }
    .cmp-table td { padding: 4px 10px; border-bottom: 1px solid #edf0f4; font-size: 12px; }
    .cmp-table td:nth-child(1) { text-align: center; width: 60px; }
    .cmp-table td:nth-child(3), .cmp-table td:nth-child(4), .cmp-table td:nth-child(5) { text-align: right; }
    .cmp-table tr:hover td { background: #f5f8fc; }
    .rank-up   { color: #c0392b; font-weight: bold; }
    .rank-down { color: #27ae60; font-weight: bold; }
    .rank-same { color: #888; }
    .delta-pos { color: #c0392b; font-weight: bold; }
    .delta-neg { color: #27ae60; font-weight: bold; }

    /* ── 顏色 ── */
    .pos { background: #ffe4e4 !important; color: #c0392b; font-weight: bold; }
    .neg { background: #e4f4e4 !important; color: #27ae60; font-weight: bold; }
    .stock-hdr .pos { background: #ff9999 !important; color: #7b0000; border-radius: 3px; padding: 1px 5px; }
    .stock-hdr .neg { background: #99dd99 !important; color: #145214; border-radius: 3px; padding: 1px 5px; }

    /* ── 回到頂部 ── */
    #back-to-top { position: fixed; bottom: 24px; right: 20px; background: #1a3a6b; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.3); display: none; z-index: 500; transition: opacity .2s; }
    #back-to-top:hover { background: #2563a8; }

    /* ── 走勢圖 tooltip ── */
    #chart-tip { position: fixed; background: rgba(20,20,40,0.92); color: #fff; padding: 4px 9px; border-radius: 4px; font-size: 12px; pointer-events: none; display: none; z-index: 999; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

    /* ── 走勢圖 ── */
    .chart-cell { vertical-align: top; padding: 6px 8px; width: 176px; min-width: 176px; border-left: 1px solid #e0e8f0; background: #f8fafc; }
    .chart-cell .no-data { font-size: 10px; color: #aaa; text-align: center; padding-top: 36px; }

    /* ── RWD ── */
    @media (max-width: 640px) {
      /* 頁首 */
      .header { padding: 7px 10px; gap: 6px; }
      .header h1 { font-size: 14px; width: 100%; }
      .divider { display: none; }
      .update-time { margin-left: 0; font-size: 11px; width: 100%; order: 99; }
      .tab-btn, .mode-btn, .refresh-btn, .query-btn { padding: 5px 10px; font-size: 11px; }
      #hist-controls input[type=date] { font-size: 11px; max-width: 130px; }
      /* 主內容 */
      .content { padding: 6px; }
      .card { border-radius: 6px; margin-bottom: 8px; }
      .card-title { padding: 6px 10px; font-size: 12px; }
      /* 彙總表：單欄 */
      .summary-grid { grid-template-columns: 1fr; }
      .sum-table:first-child { border-right: none; border-bottom: 2px solid #b0c4d8; }
      .sum-table th, .sum-table td { padding: 4px 8px; font-size: 12px; }
      /* 明細表：隱藏買進/賣出 */
      .col-buy, .col-sell, .col-prev { display: none; }
      /* 走勢圖改為橫排置於股票區塊底部 */
      .chart-row-mobile td { padding: 4px 6px !important; background: #f8fafc; border-top: 1px solid #e0e8f0; }
      .chart-row-mobile .chart-inner { display: flex; justify-content: center; gap: 6px; }
      .chart-row-mobile svg { flex: 1; max-width: 160px; height: auto; }
      .main-table { min-width: 0 !important; width: 100%; }
      .cmp-table  { min-width: 0 !important; width: 100%; }
      .main-table thead th { padding: 5px 8px; font-size: 12px; }
      .main-table td { padding: 4px 8px; font-size: 12px; }
      .main-table tbody tr.stock-hdr td { padding: 5px 8px; font-size: 12px; }
      .main-table tbody tr:not(.stock-hdr) td:first-child { width: 28px; }
      .cmp-table thead th, .cmp-table td { padding: 4px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>熱門股券商進出排行</h1>

  <div class="tab-group">
    <button class="mode-btn active" id="mode-live" onclick="switchMode('live')">即時</button>
    <button class="mode-btn" id="mode-hist" onclick="switchMode('hist')">歷史</button>
  </div>
  <div class="divider"></div>
  <div class="tab-group">
    <button class="tab-btn active" id="btn-amt" onclick="switchTab('amt')">依成交金額</button>
    <button class="tab-btn" id="btn-vol" onclick="switchTab('vol')">依成交張數</button>
    <button class="tab-btn" id="btn-cmp" onclick="switchTab('cmp')">盤中比較</button>
  </div>

  <button class="refresh-btn" id="live-refresh" onclick="manualRefresh()">↻ 重新整理</button>

  <div id="hist-controls">
    <input type="date" id="hist-date">
    <button class="query-btn" onclick="queryHistory()">查詢</button>
  </div>

  <button class="setting-btn" onclick="showTokenBar()" title="設定 GitHub Token（歷史查詢用）">⚙</button>
  <span class="update-time" id="update-time">載入中...</span>
</div>

<!-- Token 設定列 -->
<div id="token-bar">
  <span>歷史查詢需要 GitHub Token（workflow 權限）：</span>
  <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
  <button class="btn-save" onclick="saveToken()">儲存</button>
  <button class="btn-cancel" onclick="hideTokenBar()">取消</button>
  <span id="token-status"></span>
</div>

<div class="content">
  <div id="main-content" class="loading">資料載入中...</div>
</div>

<button id="back-to-top" onclick="window.scrollTo({top:0})" title="回到頂部">↑</button>
<div id="chart-tip"></div>

<script>
  // ── 狀態 ──
  let currentMode = 'live';
  let currentTab  = 'amt';
  let liveCache      = {};
  let liveChartCache = {};
  let liveKlineCache = {};
  const UNITS = { amt: '千元', vol: '張' };
  const REPO  = 'dignityken/tpex-broker';

  function todayTW() {
    const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // 讀取某日所有小時快照，回傳 { stockCode: [{hour, net}, ...] }
  const _chartCache = {};
  async function loadIntradayChart(dateKey, mode) {
    const key = `${dateKey}-${mode}`;
    if (_chartCache[key]) return _chartCache[key];
    try {
      const mResp = await fetch(`data/intraday/manifest.json?t=${Date.now()}`);
      if (!mResp.ok) return {};
      const manifest = await mResp.json();
      const hours = manifest[dateKey] || [];
      if (!hours.length) return {};
      const snaps = await Promise.all(
        hours.map(h =>
          fetch(`data/intraday/${dateKey}/${h}-${mode}.json?t=${Date.now()}`)
            .then(r => r.ok ? r.json() : null).catch(() => null)
        )
      );
      const result = {};
      snaps.forEach((snap, i) => {
        if (!snap?.stocks) return;
        snap.stocks.forEach(s => {
          if (!result[s.code]) result[s.code] = [];
          result[s.code].push({ hour: hours[i], net: s.total_net });
        });
      });
      _chartCache[key] = result;
      return result;
    } catch(e) { return {}; }
  }

  // 讀取 K 線資料（同一日期共用，不分 tab）
  const _klineCache = {};
  async function loadKlineData(dateKey, stocks) {
    if (_klineCache[dateKey]) return _klineCache[dateKey];
    const codes = [...new Set(stocks.map(s => s.code))];
    const result = {};
    await Promise.all(codes.map(async code => {
      try {
        const r = await fetch(`data/kline/${dateKey}-${code}.json?t=${Date.now()}`);
        if (r.ok) result[code] = await r.json();
      } catch(e) {}
    }));
    _klineCache[dateKey] = result;
    return result;
  }

  function buildKlineChart(bars) {
    if (!bars?.length) return '';
    const W = 160, H = 80;
    const padT = 8, padB = 14, padL = 4, padR = 4;
    const chartH = H - padT - padB;
    const chartW = W - padL - padR;
    const maxP = Math.max(...bars.map(b => b.high));
    const minP = Math.min(...bars.map(b => b.low));
    const range = maxP - minP || 1;
    const toY = p => padT + chartH - Math.round((p - minP) / range * chartH);
    const slot = Math.floor(chartW / bars.length);
    const bodyW = Math.min(16, Math.max(3, slot - 4));
    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
    // 最高最低價標籤
    s += `<text x="${W-padR}" y="${padT+5}" text-anchor="end" font-size="7" fill="#888">${maxP}</text>`;
    s += `<text x="${W-padR}" y="${H-padB}" text-anchor="end" font-size="7" fill="#888">${minP}</text>`;
    bars.forEach((b, i) => {
      const cx = padL + i * slot + Math.floor(slot / 2);
      const x  = cx - Math.floor(bodyW / 2);
      const isUp = b.close >= b.open;
      const col = isUp ? '#c0392b' : '#27ae60';
      const yH = toY(b.high), yL = toY(b.low);
      const yO = toY(b.open), yC = toY(b.close);
      const bodyTop = Math.min(yO, yC);
      const bodyH = Math.max(1, Math.abs(yC - yO));
      const label = `${b.time}　O:${b.open} H:${b.high} L:${b.low} C:${b.close}`;
      s += `<line x1="${cx}" y1="${yH}" x2="${cx}" y2="${yL}" stroke="${col}" stroke-width="1" data-val="${label}"/>`;
      s += `<rect x="${x}" y="${bodyTop}" width="${bodyW}" height="${bodyH}" fill="${col}" data-val="${label}"/>`;
      s += `<text x="${cx}" y="${H-1}" text-anchor="middle" font-size="7" fill="#999">${b.time.slice(0,2)}</text>`;
    });
    s += '</svg>';
    return s;
  }

  function buildMiniChart(points) {
    if (!points?.length) return '<div class="no-data">無盤中資料</div>';
    // 只顯示到 14:05，15 之後是補抓不計入
    const pts = points.filter(p => parseInt(p.hour) <= 14);
    if (!pts.length) return '<div class="no-data">無盤中資料</div>';
    const W = 160, H = 90;
    const padT = 6, padB = 14, padL = 4, padR = 4;
    const chartH = H - padT - padB;
    const chartW = W - padL - padR;
    const maxAbs = Math.max(...pts.map(p => Math.abs(p.net)), 1);
    const midY = padT + chartH / 2;
    const slot = Math.floor(chartW / pts.length);
    const barW = Math.max(3, slot - 2);
    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
    s += `<line x1="${padL}" y1="${midY}" x2="${W-padR}" y2="${midY}" stroke="#555" stroke-width="0.5"/>`;
    pts.forEach((p, i) => {
      const x = padL + i * slot + Math.floor((slot - barW) / 2);
      const barH = Math.max(1, Math.round(Math.abs(p.net) / maxAbs * (chartH / 2 - 2)));
      const y = p.net >= 0 ? midY - barH : midY;
      const fill = p.net >= 0 ? '#c0392b' : '#27ae60';
      const label = `${p.hour}:05　${p.net >= 0 ? '+' : ''}${p.net.toLocaleString()}`;
      // 全高透明命中區（較好點擊/hover）
      s += `<rect x="${x}" y="${padT}" width="${barW}" height="${chartH}" fill="transparent" data-val="${label}"/>`;
      s += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${fill}" opacity="0.85" rx="1" data-val="${label}"/>`;
      s += `<text x="${x + barW/2}" y="${H-1}" text-anchor="middle" font-size="7" fill="#999">${p.hour}</text>`;
    });
    s += '</svg>';
    return s;
  }

  // ── Token 管理 ──
  function getToken()   { return localStorage.getItem('gh_token') || ''; }
  function saveToken()  {
    const t = document.getElementById('token-input').value.trim();
    if (!t) return;
    localStorage.setItem('gh_token', t);
    document.getElementById('token-status').textContent = '✓ 已儲存';
    setTimeout(hideTokenBar, 1000);
  }
  function showTokenBar() {
    document.getElementById('token-bar').style.display = 'flex';
    document.getElementById('token-input').value = getToken();
    document.getElementById('token-status').textContent = '';
  }
  function hideTokenBar() { document.getElementById('token-bar').style.display = 'none'; }

  // ── 工具 ──
  function fmt(n)       { return n == null ? '-' : n.toLocaleString(); }
  function netClass(n)  { return n > 0 ? 'pos' : n < 0 ? 'neg' : ''; }
  function netText(n)   { if (n == null) return '-'; return (n > 0 ? '+' : '') + n.toLocaleString(); }
  function setStatus(msg) { document.getElementById('main-content').innerHTML = `<div class="loading">${msg}</div>`; }
  function setError(msg)  { document.getElementById('main-content').innerHTML = `<div class="error">${msg}</div>`; }

  function scrollToStock(code) {
    const el = document.getElementById('stock-' + code);
    if (!el) return;
    const headerH = document.querySelector('.header').offsetHeight;
    const top = el.getBoundingClientRect().top + window.scrollY - headerH - 6;
    window.scrollTo({ top });
  }
  window.addEventListener('scroll', () => {
    document.getElementById('back-to-top').style.display = window.scrollY > 200 ? 'block' : 'none';
  });

  // ── 走勢圖 tooltip ──
  const _tip = document.getElementById('chart-tip');
  function _showTip(x, y, text) {
    _tip.textContent = text;
    _tip.style.display = 'block';
    _tip.style.left = (x + 12) + 'px';
    _tip.style.top  = (y - 32) + 'px';
  }
  function _hideTip() { _tip.style.display = 'none'; }
  document.addEventListener('mouseover', e => {
    const v = e.target.getAttribute('data-val');
    if (v) _showTip(e.clientX, e.clientY, v); else _hideTip();
  });
  document.addEventListener('mousemove', e => {
    if (_tip.style.display !== 'none') {
      _tip.style.left = (e.clientX + 12) + 'px';
      _tip.style.top  = (e.clientY - 32) + 'px';
    }
  });
  document.addEventListener('mouseout', e => {
    if (e.target.getAttribute('data-val')) _hideTip();
  });
  document.addEventListener('touchstart', e => {
    const v = e.target.getAttribute('data-val');
    if (v) { _showTip(e.touches[0].clientX, e.touches[0].clientY, v); e.preventDefault(); }
    else _hideTip();
  }, { passive: false });

  // 手機版隱藏買進/賣出欄時，stock-hdr 的 colspan 從 4 改為 2
  function fixColspan() {
    const mobile = window.innerWidth <= 640;
    document.querySelectorAll('.hdr-name').forEach(td => { td.colSpan = mobile ? 2 : 4; });
  }
  let _resizeTimer;
  window.addEventListener('resize', () => {
    fixColspan();
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(() => {
      if (currentMode === 'live' && currentTab !== 'cmp' && liveCache[currentTab]) {
        render(liveCache[currentTab], liveChartCache[currentTab], liveKlineCache[currentTab]);
      }
    }, 300);
  });

  // ── HTML 解析（歷史直抓用）──
  function parseNum(s) {
    s = String(s).trim().replace(/,/g, '');
    if (!s || s === '-' || s.toUpperCase() === 'FALSE') return null;
    const n = parseFloat(s);
    return isNaN(n) ? null : Math.round(n);
  }

  function parseHtmlTable(htmlText, unit) {
    const doc = new DOMParser().parseFromString(htmlText, 'text/html');
    let tbl = null;
    for (const t of doc.querySelectorAll('table')) {
      const tx = t.textContent;
      if (tx.includes('元大') && tx.includes('凱基') && tx.includes('富邦')) { tbl = t; break; }
    }
    if (!tbl) throw new Error('找不到主表格（假日或資料未公布）');

    const stocks = [], pat = /(\d+)\s*[-－]\s*(.+?)\((\d+[A-Z*]*)\)/;
    let cur = null;
    for (const row of tbl.querySelectorAll('tr')) {
      const cells = [...row.querySelectorAll('td,th')];
      if (!cells.length) continue;
      const texts = cells.map(c => c.textContent.trim());
      if (texts[0] === '排行' || texts[0] === '') continue;
      const m = texts.join(' ').match(pat);
      const isHdr = m && (cells.length <= 2 || !/^\d+$/.test(texts[0]));
      if (isHdr) {
        if (cur) stocks.push(cur);
        cur = { rank: +m[1], name: m[2].trim(), code: m[3], brokers: [] };
        continue;
      }
      if (cur && cells.length >= 4 && /^\d+$/.test(texts[0])) {
        const buy = parseNum(texts[2]), sell = parseNum(texts[3]);
        if (buy !== null && sell !== null)
          cur.brokers.push({ rank: +texts[0], name: texts[1], buy, sell, net: buy - sell });
      }
    }
    if (cur) stocks.push(cur);
    stocks.forEach(s => { s.total_net = s.brokers.reduce((a, b) => a + b.net, 0); });
    return { unit, stocks };
  }

  // ── 即時：讀 JSON ──
  async function loadLive(tab) {
    setStatus('載入中...');
    try {
      const today = todayTW();
      const [resp, chartData] = await Promise.all([
        fetch(`data/${tab}.json?t=${Date.now()}`),
        loadIntradayChart(today, tab),
      ]);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      const klineData = await loadKlineData(today, data.stocks);
      liveCache[tab] = data;
      liveChartCache[tab] = chartData;
      liveKlineCache[tab] = klineData;
      render(data, chartData, klineData);
    } catch (e) {
      setError(`載入失敗：${e.message}`);
    }
  }

  // ── 歷史：本地快取 → 直抓 TPEX → fallback Action ──
  function tpexHistUrl(tab, date) {
    const d = date.replace(/-/g, '/');
    return tab === 'amt'
      ? `https://www.tpex.org.tw/www/zh-tw/afterTrading/brokerAmt?date=${encodeURIComponent(d)}&id=&response=html`
      : `https://www.tpex.org.tw/www/zh-tw/afterTrading/brokerVol?date=${encodeURIComponent(d)}&id=&response=html`;
  }

  async function loadHistory(tab, date) {
    setStatus('查詢中...');

    // 1. 本地快取
    try {
      const r = await fetch(`data/hist/${date}-${tab}.json?t=${Date.now()}`);
      if (r.ok) { const d = await r.json(); showHistData(d, date); return; }
    } catch (e) {}

    // 2. 直接抓 TPEX（不用 proxy）
    setStatus('直接讀取 TPEX 資料...');
    try {
      const r = await fetch(tpexHistUrl(tab, date));
      if (r.ok) {
        const html = await r.text();
        const data = parseHtmlTable(html, UNITS[tab]);
        showHistData(data, date);
        return;
      }
    } catch (e) {
      // CORS 被擋 → 繼續 fallback
    }

    // 3. Fallback：觸發 GitHub Action
    const token = getToken();
    if (!token) {
      setError('TPEX 不允許直接讀取，需要設定 GitHub Token 才能查詢<br><small>請點右上角 ⚙ 設定 Token（只需設定一次）</small>');
      return;
    }
    setStatus('觸發 GitHub Action 抓取資料...');
    try {
      await fetch(
        `https://api.github.com/repos/${REPO}/actions/workflows/fetch.yml/dispatches`,
        { method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ ref: 'main', inputs: { hist_date: date } }) }
      );
    } catch (e) { setError(`觸發失敗：${e.message}`); return; }

    // 輪詢
    const deadline = Date.now() + 90000;
    while (Date.now() < deadline) {
      await new Promise(r => setTimeout(r, 6000));
      try {
        const r = await fetch(`data/hist/${date}-${tab}.json?t=${Date.now()}`);
        if (r.ok) { const d = await r.json(); showHistData(d, date); return; }
      } catch (e) {}
      setStatus(`準備中，剩餘約 ${Math.ceil((deadline - Date.now()) / 1000)} 秒...`);
    }
    setError('查詢逾時，可能是假日無資料');
  }

  async function showHistData(data, date) {
    document.getElementById('update-time').textContent = `歷史資料：${date}`;
    const [chartData, klineData] = await Promise.all([
      loadIntradayChart(date, currentTab),
      loadKlineData(date, data.stocks),
    ]);
    render(data, chartData, klineData);
  }

  // ── 盤中比較 ──
  let cmpManifest = null;

  async function loadComparison(dateKey, fromH, toH) {
    try {
      const mResp = await fetch(`data/intraday/manifest.json?t=${Date.now()}`);
      if (!mResp.ok) throw new Error('尚無盤中快照資料');
      cmpManifest = await mResp.json();
    } catch(e) { setError(e.message); return; }

    // 預設日期 = 今天（台灣時間）
    if (!dateKey) {
      const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
      dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    const allDates = Object.keys(cmpManifest).sort().reverse();
    const hours = cmpManifest[dateKey] || [];

    // 15:05 是收盤補抓，預設跳過；以14為終點
    const meaningful = hours.filter(h => h !== '15');
    const base = meaningful.length >= 2 ? meaningful : hours;
    if (!toH   || !hours.includes(toH))   toH   = base[base.length - 1] || '';
    if (!fromH || !hours.includes(fromH)) fromH = base.length >= 2 ? base[base.length - 2] : base[0] || '';

    const dateOpts   = allDates.map(k => `<option value="${k}" ${k===dateKey?'selected':''}>${k}</option>`).join('');
    const hourOpts   = sel => hours.map(h => `<option value="${h}" ${h===sel?'selected':''}>${h}:05${h==='15'?' (補抓)':''}</option>`).join('');

    const ctrl = `<div class="cmp-ctrl card">
      <label>日期</label>
      <select id="cmp-date" onchange="onCmpDateChange(this.value)">${dateOpts}</select>
      <label>起</label><select id="cmp-from">${hourOpts(fromH)}</select>
      <label>→ 迄</label><select id="cmp-to">${hourOpts(toH)}</select>
      <button onclick="runComparison()">比較</button>
    </div>`;

    if (hours.length < 2 || !fromH || !toH) {
      document.getElementById('main-content').innerHTML = ctrl + '<div class="info">此日快照不足，無法比較</div>';
      document.getElementById('update-time').textContent = dateKey;
      return;
    }

    document.getElementById('main-content').innerHTML = ctrl + '<div class="loading">載入中...</div>';

    try {
      const [toAmt, toVol, fromAmt, fromVol] = await Promise.all([
        fetch(`data/intraday/${dateKey}/${toH}-amt.json?t=${Date.now()}`).then(r=>r.json()),
        fetch(`data/intraday/${dateKey}/${toH}-vol.json?t=${Date.now()}`).then(r=>r.json()),
        fetch(`data/intraday/${dateKey}/${fromH}-amt.json?t=${Date.now()}`).then(r=>r.json()),
        fetch(`data/intraday/${dateKey}/${fromH}-vol.json?t=${Date.now()}`).then(r=>r.json()),
      ]);
      document.getElementById('main-content').innerHTML =
        ctrl + buildCmpSection(toAmt, fromAmt, '千元', fromH, toH) + buildCmpSection(toVol, fromVol, '張', fromH, toH);
      document.getElementById('update-time').textContent = `${dateKey}　${fromH}:05 → ${toH}:05`;
    } catch(e) {
      document.getElementById('main-content').innerHTML = ctrl + `<div class="error">載入失敗：${e.message}</div>`;
    }
  }

  function onCmpDateChange(dateKey) {
    if (!cmpManifest) return;
    const hours = cmpManifest[dateKey] || [];
    const meaningful = hours.filter(h => h !== '15');
    const base = meaningful.length >= 2 ? meaningful : hours;
    const toH   = base[base.length - 1] || '';
    const fromH = base.length >= 2 ? base[base.length - 2] : base[0] || '';
    const hourOpts = (sel) => hours.map(h => `<option value="${h}" ${h===sel?'selected':''}>${h}:05${h==='15'?' (補抓)':''}</option>`).join('');
    document.getElementById('cmp-from').innerHTML = hourOpts(fromH);
    document.getElementById('cmp-to').innerHTML   = hourOpts(toH);
  }

  function runComparison() {
    const dateKey = document.getElementById('cmp-date').value;
    const fromH   = document.getElementById('cmp-from').value;
    const toH     = document.getElementById('cmp-to').value;
    if (fromH === toH) { alert('起訖時段不能相同'); return; }
    loadComparison(dateKey, fromH, toH);
  }

  function buildCmpSection(cur, prev, unit, fromH, toH) {
    function rankChange(c, p) {
      if (p == null) return '<span class="rank-same">NEW</span>';
      const d = p - c;
      if (d > 0) return `<span class="rank-up">▲${d}</span>`;
      if (d < 0) return `<span class="rank-down">▼${Math.abs(d)}</span>`;
      return '<span class="rank-same">—</span>';
    }
    function deltaText(c, p) {
      if (p == null) return '—';
      const d = c - p;
      if (d > 0) return `<span class="delta-pos">+${d.toLocaleString()}</span>`;
      if (d < 0) return `<span class="delta-neg">${d.toLocaleString()}</span>`;
      return '<span class="rank-same">—</span>';
    }
    const prevMap = {};
    prev.stocks.forEach(s => { prevMap[s.code] = s; });
    const rows = cur.stocks.map(s => {
      const p = prevMap[s.code];
      return `<tr>
        <td>${rankChange(s.rank, p?.rank ?? null)}</td>
        <td>${s.rank} - ${s.name}(${s.code})</td>
        <td class="${netClass(s.total_net)}">${netText(s.total_net)}</td>
        <td class="col-prev">${p ? netText(p.total_net) : '—'}</td>
        <td>${deltaText(s.total_net, p?.total_net ?? null)}</td>
      </tr>`;
    }).join('');
    return `<div class="card">
      <div class="card-title">各股買賣超比較（${unit}）　${fromH}:05 → ${toH}:05</div>
      <div class="detail-wrap">
        <table class="cmp-table">
          <thead><tr>
            <th>排名變化</th><th>股票</th>
            <th>迄 ${toH}:05 (${unit})</th>
            <th class="col-prev">起 ${fromH}:05 (${unit})</th>
            <th>變化量</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }

  // ── 渲染主表 ──
  function render(data, chartData = {}, klineData = {}) {
    const { unit, stocks } = data;
    if (data.updated_at)
      document.getElementById('update-time').textContent = `資料時間：${data.updated_at}`;

    const half = Math.ceil(stocks.length / 2);
    const sumRows = arr => arr.map(s =>
      `<tr data-code="${s.code}" onclick="scrollToStock('${s.code}')">
       <td>${s.rank} - ${s.name}(${s.code})</td>
       <td class="${netClass(s.total_net)}">${netText(s.total_net)}</td></tr>`
    ).join('');

    const buyLabel  = unit === '千元' ? '買進金額(千元)' : '總買量(張)';
    const sellLabel = unit === '千元' ? '賣出金額(千元)' : '總賣量(張)';
    const mobile = window.innerWidth <= 640;

    const buildChart = (code) => {
      const kline = buildKlineChart(klineData[code] || null);
      const net   = buildMiniChart(chartData[code] || null);
      return kline
        ? `${kline}<div style="border-top:1px solid #dde;margin:2px 0"></div>${net}`
        : net;
    };

    let detailRows;
    if (mobile) {
      // 手機版：3欄表格（排行/名稱/買賣超），圖表獨佔一行置底
      detailRows = stocks.map(s => `
        <tr class="stock-hdr" id="stock-${s.code}">
          <td class="hdr-name" colspan="2">${s.rank} - ${s.name}(${s.code})</td>
          <td><span class="${netClass(s.total_net)}">${netText(s.total_net)}</span></td>
        </tr>
        ${s.brokers.map(b => `<tr>
          <td>${b.rank}</td><td>${b.name}</td>
          <td class="${netClass(b.net)}">${netText(b.net)}</td>
        </tr>`).join('')}
        <tr class="chart-row-mobile"><td colspan="3"><div class="chart-inner">${buildChart(s.code)}</div></td></tr>
      `).join('');
    } else {
      // 桌機版：5欄 + rowspan 走勢欄
      detailRows = stocks.map(s => {
        const rowspan = 1 + s.brokers.length;
        return `
        <tr class="stock-hdr" id="stock-${s.code}">
          <td class="hdr-name" colspan="4">${s.rank} - ${s.name}(${s.code})</td>
          <td><span class="${netClass(s.total_net)}">${netText(s.total_net)}</span></td>
          <td rowspan="${rowspan}" class="chart-cell">${buildChart(s.code)}</td>
        </tr>
        ${s.brokers.map(b => `<tr>
          <td>${b.rank}</td><td>${b.name}</td>
          <td class="col-buy">${fmt(b.buy)}</td>
          <td class="col-sell">${fmt(b.sell)}</td>
          <td class="${netClass(b.net)}">${netText(b.net)}</td>
        </tr>`).join('')}`;
      }).join('');
    }

    const thead = mobile
      ? `<tr><th>排行</th><th>證商名稱</th><th>買賣超 (${unit})</th></tr>`
      : `<tr>
          <th>排行</th><th>證商名稱</th>
          <th class="col-buy">${buyLabel}</th>
          <th class="col-sell">${sellLabel}</th>
          <th>買賣超 (${unit})</th>
          <th class="chart-th">走勢</th>
        </tr>`;

    document.getElementById('main-content').innerHTML = `
      <div class="card">
        <div class="card-title">各股買賣超合計（${unit}）</div>
        <div class="summary-grid">
          <table class="sum-table">
            <tr><th>股票</th><th>買賣超 (${unit})</th></tr>${sumRows(stocks.slice(0, half))}
          </table>
          <table class="sum-table">
            <tr><th>股票</th><th>買賣超 (${unit})</th></tr>${sumRows(stocks.slice(half))}
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-title">券商明細</div>
        <div class="detail-wrap">
          <table class="main-table">
            <thead>${thead}</thead>
            <tbody>${detailRows}</tbody>
          </table>
        </div>
      </div>`;
    fixColspan();
  }

  // ── 切換模式 ──
  function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`mode-${mode}`).classList.add('active');
    const isHist = mode === 'hist';
    document.getElementById('hist-controls').style.display = isHist ? 'flex' : 'none';
    document.getElementById('live-refresh').style.display  = isHist ? 'none' : '';
    // 歷史模式隱藏盤中比較tab
    document.getElementById('btn-cmp').style.display = isHist ? 'none' : '';

    if (mode === 'live') {
      if (currentTab === 'cmp') loadComparison();
      else liveCache[currentTab] ? render(liveCache[currentTab], liveChartCache[currentTab], liveKlineCache[currentTab]) : loadLive(currentTab);
    } else {
      if (currentTab === 'cmp') switchTab('amt');
      else { setStatus('請選擇日期後按查詢'); document.getElementById('update-time').textContent = ''; }
    }
  }

  // ── 切換 tab ──
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${tab}`).classList.add('active');

    if (currentMode === 'live') {
      if (tab === 'cmp') { loadComparison(); return; }
      liveCache[tab] ? render(liveCache[tab], liveChartCache[tab], liveKlineCache[tab]) : loadLive(tab);
    } else {
      const date = document.getElementById('hist-date').value;
      if (date) loadHistory(tab, date);
      else { setStatus('請選擇日期後按查詢'); }
    }
  }

  function manualRefresh() {
    if (currentTab === 'cmp') { loadComparison(); return; }
    delete liveCache[currentTab];
    delete liveChartCache[currentTab];
    delete liveKlineCache[currentTab];
    loadLive(currentTab);
  }

  function queryHistory() {
    const date = document.getElementById('hist-date').value;
    if (!date) { alert('請選擇日期'); return; }
    loadHistory(currentTab, date);
  }

  document.getElementById('hist-date').max = new Date().toISOString().slice(0, 10);

  setInterval(() => {
    if (currentMode !== 'live') return;
    if (currentTab === 'cmp') { loadComparison(); return; }
    delete liveCache[currentTab];
    delete liveChartCache[currentTab];
    delete liveKlineCache[currentTab];
    loadLive(currentTab);
  }, 60 * 60 * 1000);

  loadLive('amt');
</script>
